# ========================================
# Application
# ========================================

spring.application.name=texttosql

# ========================================
# H2 File Database
# ========================================

spring.datasource.url=jdbc:h2:file:./data/texttosqldb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Initialize database using schema.sql and data.sql
spring.sql.init.mode=never

# ========================================
# H2 Console
# ========================================

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================================
# Ollama + Qwen 2.5
# ========================================

langchain4j.ollama.chat-model.base-url=http://localhost:11434
langchain4j.ollama.chat-model.model-name=qwen2.5:7b
langchain4j.ollama.chat-model.temperature=0.0

# ========================================
# SQL Write Operations
# ========================================

app.sql.writes.enabled=true
app.sql.writes.max-affected-rows=10